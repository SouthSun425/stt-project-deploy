spring.datasource.url=jdbc:h2:file:./data/sttdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.servlet.multipart.max-file-size=35MB
spring.servlet.multipart.max-request-size=36MB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

fastapi.base-url=${FASTAPI_BASE_URL:http://127.0.0.1:8000}
fastapi.internal-api-key=${FASTAPI_INTERNAL_API_KEY}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
signup.allowed-domains=${SIGNUP_ALLOWED_DOMAINS:gmail.com,naver.com,kakao.com,local.test}

local.admin.email=${LOCAL_ADMIN_EMAIL:}
local.admin.password=${LOCAL_ADMIN_PASSWORD:}
